name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        exercise:
          - 03-H_Multi_GPU_Parallelization/solutions
          - 06-H_Overlap_Communication_and_Computation_MPI/solutions
          - 08-H_NCCL_NVSHMEM/solutions/NCCL
          - 08-H_NCCL_NVSHMEM/solutions/NVSHMEM
          - 10-H_CUDA_Graphs_and_Device-initiated_Communication/solutions/Device-initiated_Communication_with_NVSHMEM
          - 10-H_CUDA_Graphs_and_Device-initiated_Communication/solutions/Device-initiated_Communication_with_NCCL
          - 10-H_CUDA_Graphs_and_Device-initiated_Communication/solutions/Using_CUDA_Graphs
    runs-on: ubuntu-latest
    # NVIDIA HPC SDK 26.9 (CUDA 13.3) is the newest HPC SDK container and ships
    # NCCL 2.31.2. That is the first NCCL in an HPC SDK image with the GIN
    # (GPU-initiated networking) connection types used by hands-on 10C
    # (ncclCommQueryProperties, NCCL_GIN_CONNECTION_FULL, ncclGin); the previous
    # 26.3 image had NCCL 2.29.3, which predates them.
    container:
      image: nvcr.io/nvidia/nvhpc:26.9-devel-cuda13.3-ubuntu24.04
    env:
      CUDA_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda
      MPI_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/comm_libs/mpi
      NCCL_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/comm_libs/nccl
      NVSHMEM_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/comm_libs/nvshmem
      LIBRARY_PATH: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda/lib64:/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/comm_libs/nvshmem/lib:/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/comm_libs/nccl/lib
    steps:
      - uses: actions/checkout@v4
      - name: Check NCCL GIN support
        run: |
          grep -E "^#define NCCL_(MAJOR|MINOR|PATCH) " "$NCCL_HOME/include/nccl.h" || true
          grep -rq ncclGin "$NCCL_HOME/include" || { echo "ERROR: NCCL in this image has no GIN device API"; exit 1; }
          grep -rq NCCL_GIN_CONNECTION_FULL "$NCCL_HOME/include" || { echo "ERROR: NCCL in this image lacks GIN connection types"; exit 1; }
      - name: Test Building
        working-directory: ${{ matrix.exercise }}
        run: |
          if [ -f /usr/share/lmod/lmod/init/bash ]; then
            source /usr/share/lmod/lmod/init/bash
            # Module names for the HPC-X MPI stack differ between HPC SDK releases
            # (nvhpc-hpcx, nvhpc-hpcx-cuda13, ...). The image itself already exports
            # the required PATH/LD_LIBRARY_PATH, so no module is not fatal.
            for m in nvhpc-hpcx nvhpc-hpcx-cuda13 nvhpc; do
              if module is-avail "$m" 2>/dev/null; then module load "$m"; echo "Loaded module: $m"; break; fi
            done
          fi
          make jacobi
